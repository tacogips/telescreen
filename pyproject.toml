[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "telescreen"
version = "0.1.0"
description = "Telescreen: sensitive-data retention violation monitoring and incident response"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []


[project.urls]
Homepage = "https://github.com/user/repo"
Repository = "https://github.com/user/repo"

[project.scripts]
"telescreen" = "telescreen.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "ty>=0.0.1a32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telescreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Markdown code blocks in design docs and plans are illustrative, not formatted source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ANN enforces annotations (ANN401 forbids Any); PGH forbids blanket type ignores.
select = ["E", "F", "I", "B", "UP", "SIM", "ANN", "PGH"]

[tool.ruff.lint.isort]
known-first-party = ["telescreen", "typelint"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["tools"]

[tool.ty.terminal]
error-on-warning = true

# Project AST lint (tools/typelint.py). Rules TL001-TL010 are documented in the
# module docstring and in .claude/skills/python-coding-standards/SKILL.md.
# per-file-ignores is the ONLY exemption mechanism; every entry needs a comment
# explaining the external boundary that makes it unavoidable.
[tool.typelint]
paths = ["src", "tests", "tools"]
exclude = ["src/web"]
extra-allowed-bases = []

[tool.typelint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
