# Extends the default gitleaks rules. Allowlists only content that is provably not a secret.
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 file hashes recorded in implementation-plan progress logs"
paths = ['''^impl-plans/.*\.md$''']
regexes = ['''(?:before|after)=[0-9a-f]{64}''']

[[allowlists]]
description = "12-hex data item fingerprint prefixes (key_prefix) in web test and mock fixtures"
paths = ['''^src/web/src/.*\.(test\.tsx|test\.ts|ts|json)$''']
regexTarget = "line"
regexes = ['''key_prefix"?\s*:\s*"[0-9a-f]{12}"''']

[[allowlists]]
description = "Go parity fixtures: SHA-256 shard digests and xor-v1 obfuscated synthetic fixture keys (design-go-gdrive-police.md section 9.5)"
condition = "AND"
paths = ['''^go/testdata/parity/(locators|fingerprints)\.json$''']
regexTarget = "match"
regexes = ['''shard_key"\s*:\s*"[0-9a-f]{64}"''', '''(?:item_key_b64|key_b64)"\s*:\s*"[A-Za-z0-9+/]+={0,2}"''']
