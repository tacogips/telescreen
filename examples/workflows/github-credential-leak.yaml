apiVersion: telescreen.workflow/v1
kind: Workflow
name: github-credential-leak
description: Remediate a GitHub credential finding with team escalation and Police re-verification.
trigger:
  "on": [issue_created, issue_regressed]
  match:
    sources: [github]
    rule_classes: [credential, token, private_key]
    min_severity: high
defaults:
  max_step_visits: 20
  retry:
    max_attempts: 3
    backoff: PT10S
start: rescan
steps:
  - id: rescan
    type: detect
    detectors: [rule]
    outcomes:
      found: verify_credential
      clean: completed
      error: failed
  - id: verify_credential
    type: ai_agent
    provider: managed
    model: claude-sonnet-5-5
    prompt: "Check the masked finding context and decide whether the credential is live. Return only the declared fields."
    output:
      - name: is_live_credential
        type: boolean
      - name: summary
        type: string
    next: live_check
  - id: live_check
    type: condition
    cases:
      - when: steps.verify_credential.output.is_live_credential == true
        next: first_line_triage
    default: completed
  - id: first_line_triage
    type: human_task
    title: Triage the GitHub credential finding
    assignee: team:secops-triage
    sla: PT4H
    escalation_policy: secops-standard
    outcomes:
      remediation_required: notify_developers
  - id: notify_developers
    type: notify
    channel: slack
    to: [team:dev-remediation]
    subject: GitHub remediation is required
    body: Review the assigned issue and remove the credential from affected Git history.
    next: dev_remediation
  - id: dev_remediation
    type: evidence_upload
    title: Upload proof of history rewrite and credential removal
    assignee: team:dev-remediation
    min_files: 1
    sla: PT24H
    escalation_policy: dev-remediation
    next: github_admin_review
  - id: github_admin_review
    type: human_task
    title: Verify refs, forks, and repository caches
    assignee: team:github-enterprise-admins
    sla: PT4H
    escalation_policy: secops-standard
    outcomes:
      verified: police_recheck
  - id: police_recheck
    type: police_verify
    task_type: verify_remediation
    labels: [scope=github-enterprise]
    input:
      instructions: Verify the credential is absent from refs, forks, and caches.
    timeout: PT2H
    outcomes:
      passed: completed
      failed: retry_remediation
      error: failed
  - id: retry_remediation
    type: send_back
    to: dev_remediation
    reason: Police verification did not confirm remediation.
    max_send_backs: 2
    on_exhausted: escalation_notice
  - id: escalation_notice
    type: notify
    channel: email
    to: [team:secops-triage]
    subject: GitHub remediation needs escalation
    body: Police verification did not pass within the allowed remediation attempts.
    next: failed
  - id: completed
    type: end
    result: succeeded
  - id: failed
    type: end
    result: failed
