# Local test services for notification and SSO verification.
# Mailpit catches SMTP mail (SMTP 1025, web UI and API 8025).
# Keycloak runs in development mode and imports the "telescreen" test realm
# (admin console http://127.0.0.1:8080, bootstrap admin admin/admin, dev only).
services:
  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/telescreen-realm.json:/opt/keycloak/data/import/telescreen-realm.json:ro

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: telescreen
      POSTGRES_USER: telescreen
      POSTGRES_PASSWORD: telescreen-dev
    ports:
      - "127.0.0.1:55432:5432"
