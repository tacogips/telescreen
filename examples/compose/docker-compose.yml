services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: telescreen
      POSTGRES_USER: telescreen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telescreen -d telescreen"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch-data:/meili_data

  migrate:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    env_file: .env
    environment:
      TELESCREEN_DATABASE_URL: postgresql+asyncpg://telescreen:${POSTGRES_PASSWORD}@postgres:5432/telescreen
    secrets:
      - fingerprint_key
      - police_signing_key
      - police_enrollment_token
    command: ["telescreen", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  bureau:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TELESCREEN_DATABASE_URL: postgresql+asyncpg://telescreen:${POSTGRES_PASSWORD}@postgres:5432/telescreen
      TELESCREEN_WEB_DIST: /app/web
    secrets:
      - fingerprint_key
      - police_signing_key
      - police_enrollment_token
    command: ["telescreen", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - evidence-data:/app/var/evidence
    depends_on:
      migrate:
        condition: service_completed_successfully

  engine:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TELESCREEN_DATABASE_URL: postgresql+asyncpg://telescreen:${POSTGRES_PASSWORD}@postgres:5432/telescreen
    secrets:
      - fingerprint_key
      - police_signing_key
      - police_enrollment_token
    command: ["telescreen", "worker"]
    volumes:
      - evidence-data:/app/var/evidence
    depends_on:
      migrate:
        condition: service_completed_successfully

  example-police:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TELESCREEN_POLICE_ENROLLMENT_TOKEN: ${POLICE_ENROLLMENT_TOKEN}
      TELESCREEN_FINGERPRINT_KEY: ${POLICE_FINGERPRINT_KEY}
    command: ["python", "/app/examples/police/python/private_db_police.py"]
    depends_on:
      bureau:
        condition: service_started

volumes:
  postgres-data:
  meilisearch-data:
  evidence-data:

secrets:
  fingerprint_key:
    file: ./secrets/fingerprint_key
  police_signing_key:
    file: ./secrets/police_signing_key
  police_enrollment_token:
    file: ./secrets/police_enrollment_token
