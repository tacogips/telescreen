# Fresh deployment:
# docker compose -f docker-compose.yml -f docker-compose.inventory.yml up --build
# See design-docs/specs/design-inventory-microservice.md for existing-data cutover.
services:
  inventory-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?Set INVENTORY_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  migrate:
    command: ["telescreen", "migrate", "--store", "main"]

  inventory-migrate:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    environment:
      TELESCREEN_INVENTORY_DATABASE_URL: postgresql+asyncpg://inventory:${INVENTORY_POSTGRES_PASSWORD}@inventory-postgres:5432/inventory
    command: ["telescreen-inventory", "migrate"]
    depends_on:
      inventory-postgres:
        condition: service_healthy

  inventory:
    build:
      context: ../..
      dockerfile: examples/compose/Dockerfile
    restart: unless-stopped
    # Deliberately no shared env_file: this process gets no main DB or channel secrets.
    environment:
      TELESCREEN_INVENTORY_DATABASE_URL: postgresql+asyncpg://inventory:${INVENTORY_POSTGRES_PASSWORD}@inventory-postgres:5432/inventory
      TELESCREEN_BUREAU_SERVICE_URL: http://bureau:8000
      TELESCREEN_INVENTORY_SERVICE_TOKEN: file:/run/secrets/inventory_service_token
      TELESCREEN_FINGERPRINT_KEY: file:/run/secrets/fingerprint_key
      TELESCREEN_PUBLIC_BASE_URL: ${TELESCREEN_PUBLIC_BASE_URL:-http://localhost:8000}
      TELESCREEN_DATA_OVERDUE_CRON: ${TELESCREEN_DATA_OVERDUE_CRON:-0 9 * * *}
    secrets:
      - fingerprint_key
      - inventory_service_token
    command: ["telescreen-inventory", "serve", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully

  bureau:
    environment:
      TELESCREEN_INVENTORY_SERVICE_URL: http://inventory:8001
      TELESCREEN_INVENTORY_SERVICE_TOKEN: file:/run/secrets/inventory_service_token
    secrets:
      - inventory_service_token

  engine:
    environment:
      TELESCREEN_INVENTORY_SERVICE_URL: http://inventory:8001
      TELESCREEN_INVENTORY_SERVICE_TOKEN: file:/run/secrets/inventory_service_token
    secrets:
      - inventory_service_token

volumes:
  inventory-postgres-data:

secrets:
  inventory_service_token:
    file: ./secrets/inventory_service_token
